spring.application.name=candycorn-shop
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/candycorn}
spring.datasource.username=${DB_USERNAME:candycorn}
spring.datasource.password=${DB_PASSWORD:candycorn_dev}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
